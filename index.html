<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05070c">
    <title>FlexTimer</title>
    <link rel="stylesheet" href="styles.css?v=continuous-alarm">
  </head>
  <body>
    <main class="app" aria-label="FlexTimer walk timer">
      <section class="timer-panel" aria-live="polite">
        <div class="top-row">
          <h1>FlexTimer</h1>
          <div class="top-actions">
            <div class="live-badge" id="liveBadge" aria-hidden="true">
              <span></span>
              Live
            </div>
            <button class="icon-button sound-on" id="soundToggle" type="button" aria-pressed="true" aria-label="Sound On" title="Sound On">
              <span aria-hidden="true">Sound On</span>
            </button>
          </div>
        </div>

        <div class="time-card">
          <p class="status" id="statusText">Ready</p>
          <div class="time" id="timeDisplay" role="timer" aria-label="30 minutes and 0 seconds">30:00</div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>

        <div class="primary-controls" aria-label="Main controls">
          <button class="start-button" id="startPauseButton" type="button">Start</button>
          <button class="reset-button" id="resetButton" type="button">Reset</button>
        </div>
      </section>

      <section class="quick-panel" aria-label="Timer length">
        <h2>Set Minutes</h2>
        <form class="duration-form" id="durationForm">
          <label class="duration-field" for="durationInput">
            <span>Minutes</span>
            <span class="duration-entry">
              <input
                class="duration-input"
                id="durationInput"
                name="minutes"
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                autocomplete="off"
                aria-describedby="durationHint"
                value="30"
              >
              <span class="duration-unit" aria-hidden="true">min</span>
            </span>
          </label>
          <p class="sr-only" id="durationHint">Enter a number from 1 to 999.</p>
          <button class="set-button" id="setDurationButton" type="submit">Set</button>
        </form>
      </section>

      <section class="finish-panel" id="finishPanel" hidden>
        <p>Walk complete</p>
        <div class="finish-actions">
          <button class="restart-button" id="restartButton" type="button">Restart</button>
          <button class="done-button" id="doneButton" type="button">Close</button>
        </div>
      </section>
    </main>

    <script src="app.js?v=continuous-alarm"></script>
  </body>
</html>
